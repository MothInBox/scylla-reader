[package]
name = "scylla-server"
version.workspace = true
edition = "2024"

[dependencies]
scylla-core = { path = "../scylla-core" }
scylla-plugin-api = { path = "../scylla-plugin-api" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
extism = "1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
base64 = "0.22"
dirs = "5"
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "1.0", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
