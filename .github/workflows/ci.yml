name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: nix build

      - name: Test
        run: nix develop --command bash -c "cargo test"

      - name: Clippy
        run: nix develop --command bash -c "cargo clippy -- -D warnings"

      - name: Format
        run: nix develop --command bash -c "cargo fmt --all --check"
