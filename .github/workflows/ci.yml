name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: scylla-reader
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Build
        run: nix build

      - name: Test
        run: nix develop --command bash -c "cd scylla-reader && cargo test"

      - name: Clippy
        run: nix develop --command bash -c "cd scylla-reader && cargo clippy -- -D warnings"
