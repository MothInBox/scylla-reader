[package]
name = "scylla-core"
version.workspace = true
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scylla-plugin-api = { path = "../scylla-plugin-api" }
curl = "0.4"
extism = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
