[package]
name = "scylla-reader"
version = "0.2.0"
edition = "2024"

[dependencies]
scylla-core = { path = "../scylla-core" }
scylla-plugin-api = { path = "../scylla-plugin-api" }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
dirs = "5"
async-trait = "0.1"
percent-encoding = "2"
image = "0.25"
ratatui-image = { version = "3" }
curl = "0.4"
extism = "1"

[dev-dependencies]
tempfile = "3"
